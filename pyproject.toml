[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails"
version = "1.0.0"
description = "Customizable per-web-page input/output guardrails for LLM applications. Clyde-inspired engine: guardrails are executable code, not just prompts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pymite6941" }]
keywords = ["guardrails", "llm", "ai", "input-validation", "output-validation", "clyde", "prompt-injection", "pii", "web-page"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
ai-guardrails = "guardrail:main"
ai-guardrails-server = "guardrail_server:main"
ai-guardrails-integrity = "guardrail_integrity:main"
ai-guardrails-canary = "guardrail_canary:main"
ai-guardrails-risk = "guardrail_risk:main"
ai-guardrails-modes = "guardrail_modes:main"
ai-guardrails-human-loop = "guardrail_human_loop:main"
ai-guardrails-outer-monitor = "outer_monitor:main"
ai-guardrails-logging = "guardrail_logging:main"
ai-guardrails-updates = "guardrail_updates:main"
ai-guardrails-hardware = "guardrail_hardware:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrail*"]

[tool.setuptools.package-data]
ai-guardrails = ["policies/**", "scripts/**", "web/**", "tmux/**", "docker/**", "rust/**"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
