[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails"
version = "1.0.0"
description = "Customizable per-web-page input/output guardrails for LLM applications. Clyde-inspired engine: guardrails are executable code, not just prompts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pymite6941" }]
keywords = ["guardrails", "llm", "ai", "input-validation", "output-validation", "clyde", "prompt-injection", "pii", "web-page"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
ai-guardrails = "guardrail:main"
ai-guardrails-server = "guardrail_server:main"
ai-guardrails-integrity = "guardrail_integrity:main"
ai-guardrails-canary = "guardrail_canary:main"
ai-guardrails-risk = "guardrail_risk:main"
ai-guardrails-modes = "guardrail_modes:main"
ai-guardrails-human-loop = "guardrail_human_loop:main"
ai-guardrails-outer-monitor = "outer_monitor:main"
ai-guardrails-logging = "guardrail_logging:main"
ai-guardrails-updates = "guardrail_updates:main"
ai-guardrails-hardware = "guardrail_hardware:main"

# The code is a set of top-level modules, not a package directory, so they
# are listed explicitly (packages.find only discovers directories). Data that
# the modules load at runtime is installed under <prefix>/share/ai-guardrails.
[tool.setuptools]
py-modules = [
    "guardrail",
    "guardrail_assistant",
    "guardrail_auth",
    "guardrail_canary",
    "guardrail_classifier",
    "guardrail_cli",
    "guardrail_hardware",
    "guardrail_human_loop",
    "guardrail_integrity",
    "guardrail_leakage",
    "guardrail_logging",
    "guardrail_models",
    "guardrail_modes",
    "guardrail_net",
    "guardrail_normalize",
    "guardrail_policy_versioning",
    "guardrail_prompt_injection",
    "guardrail_risk",
    "guardrail_rust_scanner",
    "guardrail_secret_stripper",
    "guardrail_server",
    "guardrail_step_monitor",
    "guardrail_testing",
    "guardrail_textclf",
    "guardrail_token_compressor",
    "guardrail_updates",
    "guardrail_users",
    "outer_monitor",
]

[tool.setuptools.data-files]
"share/ai-guardrails" = ["guardrail_textclf_model.json"]
"share/ai-guardrails/policies" = ["policies/default.json"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
