# Aho-Corasick multi-pattern scanner for AI Guardrails hot-path pattern matching.
# Memory-safe (Rust), immune to ReDoS and buffer overflows. Reads JSON lines on
# stdin, writes JSON results on stdout. Called by guardrail_rust_scanner.py.

[package]
name = "guardrail-scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "guardrail-scanner"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
